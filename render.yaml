services:
  # ─── Backend + Frontend (Single Web Service) ────────────────────
  - type: web
    name: instapark-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_HOST
        fromService:
          name: instapark-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: instapark-redis
          type: redis
          property: port
      - key: GPTCACHE_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false  # Set this manually in Render dashboard
    healthCheckPath: /api/health

  # ─── Redis Cache ────────────────────────────────────────────────
  - type: redis
    name: instapark-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # only allow internal connections
